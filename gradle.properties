org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# aapt2 из Google собран под x86_64; на этой ARM64-машине запускаем через qemu-обёртку.
android.aapt2FromMavenOverride=/root/workspace/_tools/bin/aapt2-override/aapt2