name: Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # На локальной ARM64-машине aapt2 запускается через qemu-обёртку,
      # в CI это не нужно и путь к обёртке отсутствует.
      - name: Drop local aapt2 override
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
